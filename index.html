<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ToDoTion - Productive Workspace</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
  </head>
  <body>
    <header class="main-header">
      <div class="header-brand">
        <img src="assets/logo/logo.png" alt="ToDoTion Logo" class="app-logo" />
      </div>
      <div class="header-actions">
        <!-- Botón de hamburguesa nativo -->
        <button id="btn-hamburger" class="btn-hamburger">☰</button>

        <!-- Menú de acciones principal -->
        <div id="nav-menu-responsive" class="nav-menu-responsive">
          <div class="search-container">
            <input
              type="text"
              id="search-bar"
              placeholder=" Buscar tarea por título..."
            />
          </div>
          <button id="btn-open-add-modal" class="btn-primary">
            + Añadir Tarea
          </button>
        </div>
      </div>
    </header>

    <!-- ➔ NUEVO SELECTOR DE PIZARRAS PARA MÓVIL -->
    <div class="mobile-board-selector">
      <button class="selector-tab active" data-target="column-todo">
        Por Hacer
      </button>
      <button class="selector-tab" data-target="column-doing">
        En Proceso
      </button>
      <button class="selector-tab" data-target="column-done">Finalizado</button>
    </div>

    <section class="dashboard-stats-wrapper">
      <div class="progress-dashboard">
        <div class="progress-legend">
          <span class="legend-item todo"
            >● Por Hacer (<span id="count-todo">0</span>)</span
          >
          <span class="legend-item doing"
            >● En Proceso (<span id="count-doing">0</span>)</span
          >
          <span class="legend-item done"
            >● Finalizado (<span id="count-done">0</span>)</span
          >
        </div>
        <div class="progress-bar-container">
          <div
            class="progress-segment segment-todo"
            id="bar-todo"
            style="width: 33.3%"
          ></div>
          <div
            class="progress-segment segment-doing"
            id="bar-doing"
            style="width: 33.3%"
          ></div>
          <div
            class="progress-segment segment-done"
            id="bar-done"
            style="width: 33.3%"
          ></div>
        </div>
      </div>
    </section>

    <main class="kanban-board">
      <section class="kanban-column" id="column-todo">
        <div class="column-header">
          <h2>Por Hacer</h2>
          <span class="column-badge" id="badge-todo">0</span>
        </div>
        <div class="task-list" id="list-todo"></div>
      </section>

      <section class="kanban-column" id="column-doing">
        <div class="column-header">
          <h2>En Proceso</h2>
          <span class="column-badge" id="badge-doing">0</span>
        </div>
        <div class="task-list" id="list-doing"></div>
      </section>

      <section class="kanban-column" id="column-done">
        <div class="column-header">
          <h2>Finalizado</h2>
          <span class="column-badge" id="badge-done">0</span>
        </div>
        <div class="task-list" id="list-done"></div>
      </section>
    </main>

    <div class="modal-overlay" id="modal-add-task">
      <div class="modal-box">
        <div class="modal-header">
          <h2>Crear Nueva Tarea</h2>
          <button id="btn-close-add-modal" class="btn-close">&times;</button>
        </div>
        <form id="form-add-task">
          <div class="form-group">
            <label for="input-title">Título de la tarea</label>
            <input
              type="text"
              id="input-title"
              placeholder="Ej. Comprar el pan..."
              required
              maxlength="50"
            />
          </div>
          <div class="form-group">
            <label for="input-desc">Descripción detallada</label>
            <textarea
              id="input-desc"
              placeholder="Escribe los detalles aquí..."
              rows="4"
              required
            ></textarea>
          </div>
          <div class="form-group">
            <label>Nivel de Prioridad</label>
            <div class="priority-selector">
              <label class="priority-radio baja">
                <input type="radio" name="priority" value="Baja" checked /> Baja
              </label>
              <label class="priority-radio media">
                <input type="radio" name="priority" value="Media" /> Media
              </label>
              <label class="priority-radio alta">
                <input type="radio" name="priority" value="Alta" /> Alta
              </label>
            </div>
          </div>
          <div class="form-group">
            <label for="input-date">Fecha Límite</label>
            <input type="date" id="input-date" required />
          </div>
          <div class="form-actions">
            <button type="button" id="btn-cancel-add" class="btn-secondary">
              Cancelar
            </button>
            <button type="submit" class="btn-submit">+ Crear Tarea</button>
          </div>
        </form>
      </div>
    </div>

    <div class="modal-overlay" id="modal-edit-task">
      <div class="modal-box">
        <div class="modal-header">
          <h2>Detalle de la Tarea</h2>
          <button id="btn-close-edit-modal" class="btn-close">&times;</button>
        </div>
        <form id="form-edit-task">
          <input type="hidden" id="edit-task-id" />
          <div class="form-group">
            <label for="edit-title">Título</label>
            <input type="text" id="edit-title" required maxlength="50" />
          </div>
          <div class="form-group">
            <label for="edit-desc">Descripción</label>
            <textarea id="edit-desc" rows="3" required></textarea>
          </div>
          <div class="form-group">
            <label>Prioridad</label>
            <div class="priority-selector">
              <label class="priority-radio baja">
                <input type="radio" name="edit-priority" value="Baja" /> Baja
              </label>
              <label class="priority-radio media">
                <input type="radio" name="edit-priority" value="Media" /> Media
              </label>
              <label class="priority-radio alta">
                <input type="radio" name="edit-priority" value="Alta" /> Alta
              </label>
            </div>
          </div>
          <div class="form-group">
            <label for="edit-date">Fecha Límite</label>
            <input type="date" id="edit-date" required />
          </div>
          <div class="form-group">
            <label for="edit-status">Estado de la Tarea</label>
            <select
              id="edit-status"
              style="
                padding: 10px 12px;
                border: 1px solid #e2e8f0;
                border-radius: 8px;
                font-size: 14px;
                color: var(--text-main);
                outline: none;
                width: 100%;
                background-color: white;
              "
            >
              <option value="todo">○ Por Hacer</option>
              <option value="doing">◐ En Proceso</option>
              <option value="done">● Finalizado</option>
            </select>
          </div>
          <div class="comments-section">
            <label>Comentarios del equipo</label>
            <div class="comments-log" id="comments-log"></div>
            <div class="add-comment-group">
              <input
                type="text"
                id="input-new-comment"
                placeholder="Escribe un comentario..."
              />
              <button type="button" id="btn-add-comment" class="btn-primary">
                Enviar
              </button>
            </div>
          </div>
          <div class="form-actions">
            <button type="button" id="btn-delete-task" class="btn-danger">
              🗑 Eliminar Tarea
            </button>
            <div class="actions-right">
              <button type="button" id="btn-cancel-edit" class="btn-secondary">
                Cancelar
              </button>
              <button type="submit" class="btn-submit">
                💾︎ Guardar Cambios
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <script src="js/Sortable.js"></script>
    <script src="js/main.js"></script>
    <script src="js/drag-drop.js"></script>
  </body>
</html>
