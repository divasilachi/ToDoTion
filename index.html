<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ToDoTion - Productive Workspace</title>
    <!-- Links CSS -->
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
  </head>

  <body>
    <!-- CABECERA DE LA APLICACIÓN (Ahora más limpia sin las estadísticas dentro) -->
    <header class="main-header">
      <div class="header-brand">
        <img src="assets/logo/logo.png" alt="ToDoTion Logo" class="app-logo" />
      </div>

      <div class="header-actions">
        <div class="search-container">
          <input
            type="text"
            id="search-bar"
            placeholder="Buscar tarea por título..."
          />
        </div>
        <button id="btn-open-add-modal" class="btn-primary">
          + Añadir Tarea
        </button>
      </div>
    </header>

    <!-- ¡NUEVO BLOQUE DE ESTADÍSTICAS! Situado por encima de las pizarras -->
    <section class="dashboard-stats-wrapper">
      <div class="progress-dashboard">
        <!-- PARTE IZQUIERDA: Las leyendas con sus colores -->
        <div class="progress-legend">
          <span class="legend-item todo"
            >● Por Hacer (<span id="count-todo">0</span>)</span
          >
          <span class="legend-item doing"
            >● En Proceso (<span id="count-doing">0</span>)</span
          >
          <span class="legend-item done"
            >● Finalizado (<span id="count-done">0</span>)</span
          >
        </div>

        <!-- PARTE DERECHA: La barra segmentada proporcional -->
        <div class="progress-bar-container">
          <div
            class="progress-segment segment-todo"
            id="bar-todo"
            style="width: 33.3%"
          ></div>
          <div
            class="progress-segment segment-doing"
            id="bar-doing"
            style="width: 33.3%"
          ></div>
          <div
            class="progress-segment segment-done"
            id="bar-done"
            style="width: 33.3%"
          ></div>
        </div>
      </div>
    </section>

    <!-- Tablero Kanban -->
    <main class="kanban-board">
      <!-- Pizarra 1 "ToDo" -->
      <section class="kanban-column" id="column-todo">
        <div class="column-header">
          <h2>Por Hacer</h2>
          <span class="column-badge" id="badge-todo">0</span>
        </div>
        <!-- Contenedor donde SortableJS actuará y meterá las tarjetas -->
        <div class="task-list" id="list-todo"></div>
      </section>

      <!-- Pizarra 2 "Doing" -->
      <section class="kanban-column" id="column-doing">
        <div class="column-header">
          <h2>En Proceso</h2>
          <span class="column-badge" id="badge-doing">0</span>
        </div>
        <div class="task-list" id="list-doing"></div>
      </section>

      <!-- Pizarra 3 "Done" -->
      <section class="kanban-column" id="column-done">
        <div class="column-header">
          <h2>Finalizado</h2>
          <span class="column-badge" id="badge-done">0</span>
        </div>
        <div class="task-list" id="list-done"></div>
      </section>
    </main>

    <!-- Las ventanas modales flotantes -->
    <div class="modal-overlay" id="modal-add-task">
      <div class="modal-box">
        <!-- Encabezado del cuadro -->
        <div class="modal-header">
          <h2>Crear Nueva Tarea</h2>
          <button id="btn-close-add-modal" class="btn-close">&times;</button>
        </div>

        <!-- Formulario nativo -->
        <form id="form-add-task">
          <!-- Campo: Título -->
          <div class="form-group">
            <label for="input-title">Título de la tarea</label>
            <input
              type="text"
              id="input-title"
              placeholder="Ej. Comprar el pan..."
              required
              maxlength="50"
            />
          </div>

          <!-- Campo: Descripción -->
          <div class="form-group">
            <label for="input-desc">Descripción detallada</label>
            <textarea
              id="input-desc"
              placeholder="Escribe los detalles aquí..."
              rows="4"
              required
            ></textarea>
          </div>

          <!-- Campo: Selector de Prioridad -->
          <div class="form-group">
            <label>Nivel de Prioridad</label>
            <div class="priority-selector">
              <label class="priority-radio baja">
                <input type="radio" name="priority" value="Baja" checked /> Baja
              </label>
              <label class="priority-radio media">
                <input type="radio" name="priority" value="Media" /> Media
              </label>
              <label class="priority-radio alta">
                <input type="radio" name="priority" value="Alta" /> Alta
              </label>
            </div>
          </div>

          <!-- Campo: Fecha Límite -->
          <div class="form-group">
            <label for="input-date">Fecha Límite</label>
            <input type="date" id="input-date" required />
          </div>

          <!-- Botones de Acción inferiores -->
          <div class="form-actions">
            <button type="button" id="btn-cancel-add" class="btn-secondary">
              Cancelar
            </button>
            <button type="submit" class="btn-submit">+ Crear Tareas</button>
          </div>
        </form>
      </div>
    </div>
    <!-- 1. La librería externa SortableJS -->
    <script src="js/sortable.js"></script>

    <!-- 2. Tu archivo principal de cargar datos -->
    <script src="js/main.js"></script>

    <!-- 3. ¡NUEVO! Tu archivo exclusivo de movimiento -->
    <script src="js/drag-drop.js"></script>
  </body>
</html>
